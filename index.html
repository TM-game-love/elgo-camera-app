<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#071018" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>姿勢解析カメラ</title>
  <style>
    :root{
      --bg:#071018;
      --panel:rgba(11,19,28,.78);
      --panel2:rgba(19,29,40,.72);
      --line:rgba(255,255,255,.12);
      --text:#f7fbff;
      --muted:#a9b7c5;
      --cyan:#53d8ff;
      --blue:#4f8cff;
      --green:#65f29a;
      --yellow:#ffd95a;
      --red:#ff3b30;
      --shadow:0 14px 40px rgba(0,0,0,.34);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;color:var(--text);overflow:hidden}
    button{font:inherit;color:inherit}

    #app{
      position:fixed;inset:0;overflow:hidden;background:#02070b;
    }

    #cameraStage{
      position:absolute;inset:0;
      background:
        radial-gradient(circle at 50% 25%,rgba(45,91,120,.20),transparent 40%),
        linear-gradient(180deg,#101922,#05090d 70%);
    }

    #video{
      position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
      background:#03070b;
    }

    #overlay{
      position:absolute;inset:0;width:100%;height:100%;pointer-events:none;
    }

    .shade{
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(180deg,rgba(0,0,0,.38) 0%,transparent 18%,transparent 55%,rgba(0,0,0,.22) 67%,rgba(0,0,0,.70) 100%);
    }

    .topbar{
      position:absolute;
      top:max(12px,calc(env(safe-area-inset-top) + 8px));
      left:12px;right:12px;height:58px;
      display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
      border:1px solid var(--line);border-radius:18px;
      background:rgba(6,13,20,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      box-shadow:var(--shadow);z-index:5;padding:0 14px;
    }
    .live{display:flex;align-items:center;gap:8px;font-weight:750;font-size:13px;white-space:nowrap}
    .liveDot{width:9px;height:9px;border-radius:999px;background:#5d6872;box-shadow:0 0 0 0 rgba(101,242,154,.0)}
    .live.active .liveDot{background:var(--green);box-shadow:0 0 0 5px rgba(101,242,154,.12)}
    .live.active{color:var(--green)}
    .title{font-size:18px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
    .iconBtn{justify-self:end;width:38px;height:38px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;cursor:pointer}
    .iconBtn:active{background:rgba(255,255,255,.09);transform:scale(.96)}

    .badge{
      position:absolute;z-index:4;right:14px;top:max(82px,calc(env(safe-area-inset-top) + 78px));
      display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:14px;
      background:rgba(12,20,30,.67);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border:1px solid var(--line);font-size:12px;font-weight:750;color:#dfeeff;
    }
    .cube{width:20px;height:20px;border:1.6px solid var(--cyan);transform:rotate(30deg);border-radius:2px;opacity:.9}

    .statsPanel{
      position:absolute;z-index:5;left:12px;right:12px;
      bottom:calc(132px + env(safe-area-inset-bottom));
      background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow);
      transition:.22s ease;
    }
    .statsPanel.hidden{opacity:0;transform:translateY(16px);pointer-events:none}
    .panelHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
    .panelTitle{font-size:14px;font-weight:800}
    .panelMeta{font-size:11px;color:var(--muted)}
    .angleGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
    .angleCard{min-width:0;padding:8px 8px 9px 11px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.035);border-radius:12px;position:relative;overflow:hidden}
    .angleCard::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:999px;background:var(--cyan)}
    .angleCard[data-tone="green"]::before{background:var(--green)}
    .angleCard[data-tone="yellow"]::before{background:var(--yellow)}
    .angleLabel{font-size:10px;color:#cbd6e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .angleValue{margin-top:2px;font-weight:850;font-size:20px;line-height:1;letter-spacing:-.02em}
    .angleValue small{font-size:11px;color:#d7e2ed;margin-left:2px}

    .toggleRow{
      position:absolute;z-index:5;bottom:calc(95px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
      display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:999px;background:rgba(7,13,20,.78);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)
    }
    .toggleBtn{border:0;background:transparent;display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer}
    .switch{width:31px;height:18px;border-radius:999px;background:#4f5a65;position:relative;transition:.2s}
    .switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:white;transition:.2s}
    .toggleBtn.on .switch{background:var(--blue)}
    .toggleBtn.on .switch::after{transform:translateX(13px)}

    .bottomBar{
      position:absolute;z-index:6;left:0;right:0;bottom:0;height:calc(88px + env(safe-area-inset-bottom));
      padding:8px 24px calc(10px + env(safe-area-inset-bottom));
      display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:end;
      background:linear-gradient(180deg,transparent,rgba(3,7,11,.68) 28%,rgba(3,7,11,.90));
    }
    .action{justify-self:center;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:68px}
    .actionCircle{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.72);background:rgba(13,20,28,.54);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .action span{font-size:11px;font-weight:700}
    .record .actionCircle{width:62px;height:62px;border:4px solid white;box-shadow:0 0 0 2px rgba(255,255,255,.16);background:transparent;padding:5px}
    .recordCore{width:100%;height:100%;border-radius:50%;background:var(--red);transition:.2s}
    .record.recording .recordCore{border-radius:10px;transform:scale(.62)}
    .action:active .actionCircle{transform:scale(.94)}

    .timer{
      position:absolute;z-index:7;right:18px;bottom:calc(89px + env(safe-area-inset-bottom));
      padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:rgba(5,9,14,.80);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      display:none;align-items:center;gap:7px;font-size:11px;font-variant-numeric:tabular-nums;
    }
    .timer.visible{display:flex}.recDot{width:7px;height:7px;border-radius:50%;background:var(--red)}

    .startup{
      position:absolute;z-index:20;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 30%,rgba(34,84,119,.28),transparent 40%),linear-gradient(180deg,#07111a,#02070b);
      transition:.28s ease;
    }
    .startup.hide{opacity:0;pointer-events:none}
    .startCard{max-width:420px;width:100%;padding:24px 20px 20px;border:1px solid var(--line);border-radius:24px;background:rgba(11,18,27,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);text-align:center}
    .startLogo{width:72px;height:72px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(83,216,255,.18),rgba(79,140,255,.12));border:1px solid rgba(83,216,255,.28)}
    .startCard h1{font-size:22px;margin:0 0 7px}.startCard p{font-size:13px;line-height:1.65;color:var(--muted);margin:0 0 18px}
    .startBtn{width:100%;border:0;border-radius:14px;padding:14px 16px;background:linear-gradient(135deg,#43cfff,#4b82ff);font-weight:850;color:white;box-shadow:0 10px 26px rgba(55,142,255,.28);cursor:pointer}
    .startBtn:disabled{opacity:.55;cursor:default}.note{font-size:10px!important;color:#788898!important;margin-top:10px!important;margin-bottom:0!important}

    .toast{position:absolute;z-index:30;left:50%;top:92px;transform:translate(-50%,-12px);max-width:calc(100% - 34px);padding:10px 14px;border:1px solid var(--line);background:rgba(8,14,21,.90);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:12px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.22s;box-shadow:var(--shadow);text-align:center}
    .toast.show{opacity:1;transform:translate(-50%,0)}

    .settingsSheet{position:absolute;z-index:25;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end}
    .settingsSheet.show{display:flex}
    .sheet{width:100%;background:#0b141e;border-radius:24px 24px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line);box-shadow:0 -20px 50px rgba(0,0,0,.38)}
    .grabber{width:42px;height:4px;border-radius:999px;background:#44515e;margin:0 auto 14px}.sheet h2{font-size:18px;margin:0 0 4px}.sheetSub{font-size:11px;color:var(--muted);margin-bottom:16px}
    .settingItem{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid rgba(255,255,255,.07)}
    .settingText b{font-size:13px}.settingText div{font-size:10px;color:var(--muted);margin-top:3px}
    .seg{display:flex;background:#121e29;border-radius:10px;padding:3px}.seg button{border:0;background:transparent;border-radius:8px;padding:7px 10px;color:var(--muted);font-size:11px;font-weight:800}.seg button.active{background:#243647;color:white}
    .closeSheet{margin-top:14px;width:100%;border:1px solid var(--line);background:#14212d;border-radius:13px;padding:12px;font-weight:800}

    .noPoseHint{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 13px;border-radius:12px;background:rgba(6,13,20,.60);border:1px solid var(--line);font-size:12px;color:#d8e6f2;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
    .noPoseHint.show{opacity:1}

    @media (max-width:390px){
      .topbar{height:54px}.title{font-size:16px}.live{font-size:11px}.angleValue{font-size:18px}.statsPanel{bottom:calc(128px + env(safe-area-inset-bottom))}.toggleRow{bottom:calc(92px + env(safe-area-inset-bottom))}
    }
    @media (orientation:landscape){
      .statsPanel{left:auto;width:42%;bottom:88px}.toggleRow{left:24%;bottom:16px}.bottomBar{left:50%;height:88px;padding-bottom:10px}.timer{bottom:90px}.badge{top:80px}
    }
  </style>
</head>
<body>
<div id="app">
  <div id="cameraStage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="shade"></div>
  </div>

  <header class="topbar">
    <div id="liveStatus" class="live"><span class="liveDot"></span><span id="liveText">準備中</span></div>
    <div class="title">姿勢解析カメラ</div>
    <button id="settingsBtn" class="iconBtn" aria-label="設定">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.6v-.1A1.7 1.7 0 0 0 8.5 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.1 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2V9.6h.4A1.7 1.7 0 0 0 4.1 8.5a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 8.5 4.1a1.7 1.7 0 0 0 1-.6A1.7 1.7 0 0 0 9.9 2H14v.4A1.7 1.7 0 0 0 15 4.1a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 8.5c.18.38.5.7.9.9.34.16.72.22 1.1.2h.1v4.1h-.1A1.7 1.7 0 0 0 19.4 15Z"/></svg>
    </button>
  </header>

  <div class="badge"><span class="cube"></span><span>3D World角度</span></div>
  <div id="noPoseHint" class="noPoseHint">全身が入るように映してください</div>

  <section id="statsPanel" class="statsPanel">
    <div class="panelHead"><div class="panelTitle">関節の角度（3D解析）</div><div id="fpsText" class="panelMeta">-- FPS ・ 度(°)</div></div>
    <div class="angleGrid">
      <div class="angleCard" data-tone="green"><div class="angleLabel">左肘</div><div class="angleValue" data-angle="leftElbow">--<small>°</small></div></div>
      <div class="angleCard" data-tone="green"><div class="angleLabel">右肘</div><div class="angleValue" data-angle="rightElbow">--<small>°</small></div></div>
      <div class="angleCard" data-tone="yellow"><div class="angleLabel">左膝</div><div class="angleValue" data-angle="leftKnee">--<small>°</small></div></div>
      <div class="angleCard" data-tone="yellow"><div class="angleLabel">右膝</div><div class="angleValue" data-angle="rightKnee">--<small>°</small></div></div>
      <div class="angleCard"><div class="angleLabel">左股関節</div><div class="angleValue" data-angle="leftHip">--<small>°</small></div></div>
      <div class="angleCard"><div class="angleLabel">右股関節</div><div class="angleValue" data-angle="rightHip">--<small>°</small></div></div>
    </div>
  </section>

  <div class="toggleRow">
    <button id="skeletonToggle" class="toggleBtn on"><span>骨格</span><span class="switch"></span></button>
    <button id="labelsToggle" class="toggleBtn on"><span>数値</span><span class="switch"></span></button>
  </div>

  <div id="recordTimer" class="timer"><span class="recDot"></span><span id="timerText">00:00</span></div>

  <nav class="bottomBar">
    <button id="photoBtn" class="action" aria-label="写真">
      <span class="actionCircle"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h3l1.4-2h7.2L17 7h3v12H4Z"/><circle cx="12" cy="13" r="4"/></svg></span><span>写真</span>
    </button>
    <button id="recordBtn" class="action record" aria-label="録画"><span class="actionCircle"><span class="recordCore"></span></span><span id="recordLabel">録画</span></button>
    <button id="csvBtn" class="action" aria-label="CSV出力">
      <span class="actionCircle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h8l4 4v16H6Z"/><path d="M14 2v5h5"/><path d="M8 12h8M8 16h8"/></svg></span><span>CSV</span>
    </button>
  </nav>

  <div id="startup" class="startup">
    <div class="startCard">
      <div class="startLogo"><svg width="39" height="39" viewBox="0 0 24 24" fill="none" stroke="#63dfff" stroke-width="1.8"><circle cx="12" cy="4" r="2"/><path d="M12 6v5m0 0-4 4m4-4 4 4M8 9l4 2 4-2M8 15l-2 6m10-6 2 6"/></svg></div>
      <h1>姿勢解析カメラ</h1>
      <p>背面カメラで人体を検出し、MediaPipeの3D World座標から関節角度をリアルタイム算出します。</p>
      <button id="startBtn" class="startBtn">カメラを開始</button>
      <p id="startupStatus" class="note">初回はAIモデルを読み込みます。カメラ映像の解析は端末上で行われます。</p>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <div id="settingsSheet" class="settingsSheet">
    <div class="sheet">
      <div class="grabber"></div>
      <h2>表示・記録設定</h2>
      <div class="sheetSub">角度計算は常に3D World座標を使用します。</div>
      <div class="settingItem">
        <div class="settingText"><b>角度の平滑化</b><div>数値の細かな揺れを抑えます</div></div>
        <div id="smoothSeg" class="seg"><button data-v="0.15">強</button><button data-v="0.28" class="active">標準</button><button data-v="0.5">弱</button></div>
      </div>
      <div class="settingItem">
        <div class="settingText"><b>CSVサンプリング</b><div>計測中の履歴を端末内に保持</div></div>
        <div id="csvSeg" class="seg"><button data-v="200">5Hz</button><button data-v="100" class="active">10Hz</button><button data-v="50">20Hz</button></div>
      </div>
      <button id="closeSettings" class="closeSheet">閉じる</button>
    </div>
  </div>

  <canvas id="captureCanvas" hidden></canvas>
</div>

<script type="module">
import { FilesetResolver, PoseLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs";

const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task";
const WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm";

const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
const captureCanvas = document.getElementById('captureCanvas');
const cctx = captureCanvas.getContext('2d');
const startup = document.getElementById('startup');
const startBtn = document.getElementById('startBtn');
const startupStatus = document.getElementById('startupStatus');
const liveStatus = document.getElementById('liveStatus');
const liveText = document.getElementById('liveText');
const noPoseHint = document.getElementById('noPoseHint');
const fpsText = document.getElementById('fpsText');
const statsPanel = document.getElementById('statsPanel');
const skeletonToggle = document.getElementById('skeletonToggle');
const labelsToggle = document.getElementById('labelsToggle');
const photoBtn = document.getElementById('photoBtn');
const recordBtn = document.getElementById('recordBtn');
const recordLabel = document.getElementById('recordLabel');
const csvBtn = document.getElementById('csvBtn');
const recordTimer = document.getElementById('recordTimer');
const timerText = document.getElementById('timerText');
const settingsBtn = document.getElementById('settingsBtn');
const settingsSheet = document.getElementById('settingsSheet');
const closeSettings = document.getElementById('closeSettings');
const toast = document.getElementById('toast');

let landmarker = null;
let cameraStream = null;
let running = false;
let showSkeleton = true;
let showLabels = true;
let smoothAlpha = 0.28;
let csvInterval = 100;
let lastVideoTime = -1;
let lastInferenceStamp = -1;
let lastResult = null;
let latestAngles = {};
let smoothedAngles = {};
let csvRows = [];
let lastCsvAt = 0;
let frames = 0;
let fps = 0;
let fpsStarted = performance.now();
let lastPoseSeenAt = 0;
let toastTimer = null;
let mediaRecorder = null;
let recordedChunks = [];
let recordingStartedAt = 0;
let sessionStartedAt = 0;
let recordingTimerHandle = null;
let recordingUsesComposite = false;
let captureLoopHandle = null;
let delegateUsed = 'CPU';

const JOINTS = {
  leftElbow:  { label:'左肘',      a:11,b:13,c:15, anchor:13, tone:'#65f29a' },
  rightElbow: { label:'右肘',      a:12,b:14,c:16, anchor:14, tone:'#65f29a' },
  leftKnee:   { label:'左膝',      a:23,b:25,c:27, anchor:25, tone:'#ffd95a' },
  rightKnee:  { label:'右膝',      a:24,b:26,c:28, anchor:26, tone:'#ffd95a' },
  leftHip:    { label:'左股関節',  a:11,b:23,c:25, anchor:23, tone:'#53d8ff' },
  rightHip:   { label:'右股関節',  a:12,b:24,c:26, anchor:24, tone:'#53d8ff' },
  leftAnkle:  { label:'左足首',    a:25,b:27,c:31, anchor:27, tone:'#c09cff' },
  rightAnkle: { label:'右足首',    a:26,b:28,c:32, anchor:28, tone:'#c09cff' }
};

const CONNECTIONS = [
  [0,11],[0,12],[11,12],
  [11,13],[13,15],
  [12,14],[14,16],
  [11,23],[12,24],[23,24],
  [23,25],[25,27],[27,31],
  [24,26],[26,28],[28,32]
];
const DRAW_POINTS = new Set([0,11,12,13,14,15,16,23,24,25,26,27,28,31,32]);

function showToast(message, ms=2200){
  clearTimeout(toastTimer);
  toast.textContent = message;
  toast.classList.add('show');
  toastTimer = setTimeout(()=>toast.classList.remove('show'), ms);
}

function setLive(state, text){
  liveStatus.classList.toggle('active', state);
  liveText.textContent = text;
}

function clamp(v,min,max){ return Math.min(max,Math.max(min,v)); }

function angle3D(a,b,c){
  if(!a||!b||!c) return null;
  const v1 = {x:a.x-b.x,y:a.y-b.y,z:a.z-b.z};
  const v2 = {x:c.x-b.x,y:c.y-b.y,z:c.z-b.z};
  const n1 = Math.hypot(v1.x,v1.y,v1.z);
  const n2 = Math.hypot(v2.x,v2.y,v2.z);
  if(n1 < 1e-8 || n2 < 1e-8) return null;
  const cos = clamp((v1.x*v2.x + v1.y*v2.y + v1.z*v2.z)/(n1*n2),-1,1);
  return Math.acos(cos) * 180 / Math.PI;
}

function enoughVisibility(points, ids, threshold=.35){
  return ids.every(i => !points[i] || points[i].visibility == null || points[i].visibility >= threshold);
}

function computeAngles(world){
  const result = {};
  for(const [key,j] of Object.entries(JOINTS)){
    if(!enoughVisibility(world,[j.a,j.b,j.c])){ result[key]=null; continue; }
    result[key] = angle3D(world[j.a],world[j.b],world[j.c]);
  }
  return result;
}

function smoothAngles(raw){
  const out = {};
  for(const [key,val] of Object.entries(raw)){
    if(val == null || !Number.isFinite(val)){ out[key]=null; continue; }
    const prev = smoothedAngles[key];
    const next = prev == null ? val : prev + smoothAlpha*(val-prev);
    smoothedAngles[key] = next;
    out[key] = next;
  }
  return out;
}

function updateAngleCards(angles){
  document.querySelectorAll('[data-angle]').forEach(el=>{
    const key = el.dataset.angle;
    const v = angles[key];
    el.innerHTML = `${v==null?'--':Math.round(v)}<small>°</small>`;
  });
}

function resizeOverlay(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, overlay.clientWidth);
  const h = Math.max(1, overlay.clientHeight);
  overlay.width = Math.round(w*dpr);
  overlay.height = Math.round(h*dpr);
  octx.setTransform(dpr,0,0,dpr,0,0);
}

function coverTransform(srcW,srcH,dstW,dstH){
  const scale = Math.max(dstW/srcW,dstH/srcH);
  return {scale, ox:(dstW-srcW*scale)/2, oy:(dstH-srcH*scale)/2};
}

function mapPoint(lm, dstW=overlay.clientWidth, dstH=overlay.clientHeight){
  const sw = video.videoWidth || dstW;
  const sh = video.videoHeight || dstH;
  const t = coverTransform(sw,sh,dstW,dstH);
  return {x:lm.x*sw*t.scale+t.ox, y:lm.y*sh*t.scale+t.oy};
}

function visible(lm){ return !lm || lm.visibility == null || lm.visibility > .3; }

function roundedRect(ctx,x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath();
}

function drawPose(ctx, landmarks, angles, dstW, dstH, opts={}){
  if(!landmarks?.length) return;
  const stroke = opts.stroke || '#53d8ff';
  const lineWidth = opts.lineWidth || 3;
  const pointR = opts.pointR || 4.5;
  const map = lm => mapPointForSize(lm,dstW,dstH);

  if(showSkeleton){
    ctx.save();
    ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.lineWidth=lineWidth;ctx.shadowColor='rgba(47,186,255,.42)';ctx.shadowBlur=8;
    for(const [a,b] of CONNECTIONS){
      const la=landmarks[a], lb=landmarks[b]; if(!visible(la)||!visible(lb)) continue;
      const p1=map(la), p2=map(lb);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
    }
    ctx.shadowBlur=0;
    for(let i=0;i<landmarks.length;i++){
      const lm=landmarks[i]; if(!visible(lm)) continue;
      if(!DRAW_POINTS.has(i)) continue;
      const p=map(lm);ctx.beginPath();ctx.fillStyle=(i===23||i===24)?'#4f8cff':'#f7fbff';ctx.strokeStyle='#3bbcff';ctx.lineWidth=2;ctx.arc(p.x,p.y,pointR,0,Math.PI*2);ctx.fill();ctx.stroke();
    }
    ctx.restore();
  }

  if(showLabels){
    ctx.save();
    ctx.font=`700 ${opts.fontSize||12}px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;
    ctx.textBaseline='middle';
    const keys=['leftElbow','rightElbow','leftKnee','rightKnee','leftHip','rightHip'];
    for(const key of keys){
      const j=JOINTS[key], v=angles[key], lm=landmarks[j.anchor];
      if(v==null||!visible(lm)) continue;
      const p=map(lm);
      const txt=`${j.label} ${Math.round(v)}°`;
      const tw=ctx.measureText(txt).width;
      const padX=9,h=28,w=tw+padX*2;
      const leftSide=key.startsWith('left');
      let x=p.x+(leftSide?-w-16:16), y=p.y-h/2;
      x=clamp(x,8,dstW-w-8); y=clamp(y,82,dstH-h-150);
      roundedRect(ctx,x,y,w,h,9);ctx.fillStyle='rgba(7,14,22,.78)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle='#fff';ctx.fillText(txt,x+padX,y+h/2);
      ctx.beginPath();ctx.strokeStyle=j.tone;ctx.lineWidth=3;ctx.arc(p.x,p.y,10,-.85,.85);ctx.stroke();
    }
    ctx.restore();
  }
}

function mapPointForSize(lm,dstW,dstH){
  const sw=video.videoWidth||dstW, sh=video.videoHeight||dstH;
  const t=coverTransform(sw,sh,dstW,dstH);
  return {x:lm.x*sw*t.scale+t.ox, y:lm.y*sh*t.scale+t.oy};
}

function drawOverlay(){
  const w=overlay.clientWidth,h=overlay.clientHeight;
  octx.clearRect(0,0,w,h);
  if(lastResult?.landmarks?.[0]) drawPose(octx,lastResult.landmarks[0],latestAngles,w,h);
}

function drawVideoCover(ctx,w,h){
  const sw=video.videoWidth, sh=video.videoHeight;
  if(!sw||!sh) return;
  const t=coverTransform(sw,sh,w,h);
  ctx.drawImage(video,t.ox,t.oy,sw*t.scale,sh*t.scale);
}

function drawCaptureFrame(){
  const w=captureCanvas.width,h=captureCanvas.height;
  cctx.clearRect(0,0,w,h);
  drawVideoCover(cctx,w,h);
  const grad=cctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'rgba(0,0,0,.20)');grad.addColorStop(.62,'rgba(0,0,0,0)');grad.addColorStop(1,'rgba(0,0,0,.40)');cctx.fillStyle=grad;cctx.fillRect(0,0,w,h);
  if(lastResult?.landmarks?.[0]) drawPose(cctx,lastResult.landmarks[0],latestAngles,w,h,{lineWidth:Math.max(3,w/300),pointR:Math.max(4,w/220),fontSize:Math.max(12,w/60)});
  cctx.save();cctx.fillStyle='rgba(5,11,17,.70)';roundedRect(cctx,24,24,Math.min(360,w-48),48,15);cctx.fill();cctx.font=`800 ${Math.max(15,w/45)}px -apple-system,sans-serif`;cctx.fillStyle='#65f29a';cctx.textBaseline='middle';cctx.fillText('● 3D POSE ANALYSIS',42,48);cctx.restore();
}

function configureCaptureCanvas(){
  const ratio = innerWidth/innerHeight;
  if(ratio < 1){ captureCanvas.width=720; captureCanvas.height=Math.round(720/ratio); }
  else{ captureCanvas.height=720; captureCanvas.width=Math.round(720*ratio); }
  if(captureCanvas.height>1280){captureCanvas.height=1280;captureCanvas.width=Math.round(1280*ratio)}
}

async function initLandmarker(){
  startupStatus.textContent='AIモデルを読み込み中…';
  const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
  const common = {
    runningMode:'VIDEO', numPoses:1,
    minPoseDetectionConfidence:.5,
    minPosePresenceConfidence:.5,
    minTrackingConfidence:.5,
    outputSegmentationMasks:false
  };
  let lastErr;
  for(const delegate of ['GPU','CPU']){
    try{
      landmarker = await PoseLandmarker.createFromOptions(fileset,{...common,baseOptions:{modelAssetPath:MODEL_URL,delegate}});
      delegateUsed=delegate; return;
    }catch(e){ lastErr=e; console.warn(`MediaPipe ${delegate} delegate failed`,e); }
  }
  throw lastErr || new Error('MediaPipeの初期化に失敗しました');
}

async function startCamera(){
  if(!window.isSecureContext && location.hostname!=='localhost' && location.hostname!=='127.0.0.1'){
    throw new Error('スマホのカメラ利用にはHTTPSでページを開く必要があります。');
  }
  if(!navigator.mediaDevices?.getUserMedia) throw new Error('このブラウザはカメラAPIに対応していません。');
  startupStatus.textContent='背面カメラを起動中…';
  cameraStream = await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}, frameRate:{ideal:30,max:60} }
  });
  video.srcObject=cameraStream;
  await video.play();
  configureCaptureCanvas();
  resizeOverlay();
}

async function startApp(){
  if(running) return;
  startBtn.disabled=true;
  try{
    if(!landmarker) await initLandmarker();
    await startCamera();
    running=true;
    csvRows=[];smoothedAngles={};lastVideoTime=-1;lastInferenceStamp=-1;lastCsvAt=0;sessionStartedAt=performance.now();
    startup.classList.add('hide');
    setLive(true,'LIVE 解析中');
    showToast(`MediaPipe起動完了（${delegateUsed}）`);
    requestAnimationFrame(predictLoop);
  }catch(err){
    console.error(err);
    startupStatus.textContent=err?.message||'起動に失敗しました。';
    startBtn.disabled=false;
    setLive(false,'起動エラー');
  }
}

function nextTimestamp(){
  let t=Math.round(performance.now());
  if(t<=lastInferenceStamp) t=lastInferenceStamp+1;
  lastInferenceStamp=t;return t;
}

function maybeRecordCsv(now, world, angles){
  if(now-lastCsvAt<csvInterval) return;
  lastCsvAt=now;
  const row={
    iso_time:new Date().toISOString(),
    elapsed_ms:Math.round(now-sessionStartedAt),
    left_elbow:angles.leftElbow,
    right_elbow:angles.rightElbow,
    left_knee:angles.leftKnee,
    right_knee:angles.rightKnee,
    left_hip:angles.leftHip,
    right_hip:angles.rightHip,
    left_ankle:angles.leftAnkle,
    right_ankle:angles.rightAnkle
  };
  // 必要なら後から33点のworld座標をCSVへ追加しやすいよう、ここでworldも取得済み。
  csvRows.push(row);
  if(csvRows.length>72000) csvRows.splice(0,1000);
}

function updateFps(now){
  frames++;
  if(now-fpsStarted>=1000){fps=Math.round(frames*1000/(now-fpsStarted));frames=0;fpsStarted=now;fpsText.textContent=`${fps} FPS ・ ${delegateUsed} ・ 度(°)`;}
}

function predictLoop(now){
  if(!running) return;
  try{
    if(video.readyState>=2 && video.currentTime!==lastVideoTime){
      const result=landmarker.detectForVideo(video,nextTimestamp());
      lastVideoTime=video.currentTime;
      lastResult=result;
      if(result?.landmarks?.length && result?.worldLandmarks?.length){
        lastPoseSeenAt=now;
        const raw=computeAngles(result.worldLandmarks[0]);
        latestAngles=smoothAngles(raw);
        updateAngleCards(latestAngles);
        maybeRecordCsv(now,result.worldLandmarks[0],latestAngles);
        noPoseHint.classList.remove('show');
      }else{
        if(now-lastPoseSeenAt>700) noPoseHint.classList.add('show');
      }
      drawOverlay();
      updateFps(now);
    }
  }catch(e){console.error('Pose inference error',e);}
  requestAnimationFrame(predictLoop);
}

function downloadBlob(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function stamp(){const d=new Date();const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;}

async function takePhoto(){
  if(!running){showToast('先にカメラを開始してください');return;}
  configureCaptureCanvas();drawCaptureFrame();
  captureCanvas.toBlob(blob=>{
    if(!blob){showToast('写真の作成に失敗しました');return;}
    downloadBlob(blob,`pose_${stamp()}.jpg`);showToast('解析付き写真を保存しました');
  },'image/jpeg',.92);
}

function chooseMime(){
  if(typeof MediaRecorder==='undefined') return '';
  const candidates=['video/mp4;codecs=h264','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  return candidates.find(t=>MediaRecorder.isTypeSupported?.(t))||'';
}

function beginCaptureLoop(){
  const tick=()=>{if(!mediaRecorder||mediaRecorder.state!=='recording')return;drawCaptureFrame();captureLoopHandle=requestAnimationFrame(tick)};tick();
}
function stopCaptureLoop(){if(captureLoopHandle)cancelAnimationFrame(captureLoopHandle);captureLoopHandle=null;}

function startRecording(){
  if(!running){showToast('先にカメラを開始してください');return;}
  if(typeof MediaRecorder==='undefined'){showToast('このブラウザは動画録画に対応していません');return;}
  recordedChunks=[];configureCaptureCanvas();drawCaptureFrame();
  let stream;
  recordingUsesComposite=typeof captureCanvas.captureStream==='function';
  if(recordingUsesComposite){stream=captureCanvas.captureStream(30);}else{stream=cameraStream;}
  const mime=chooseMime();
  try{mediaRecorder=mime?new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:5_000_000}):new MediaRecorder(stream);}catch(e){mediaRecorder=new MediaRecorder(stream);}
  mediaRecorder.ondataavailable=e=>{if(e.data?.size)recordedChunks.push(e.data)};
  mediaRecorder.onstop=()=>{
    stopCaptureLoop();
    const type=mediaRecorder.mimeType||mime||'video/webm';
    const ext=type.includes('mp4')?'mp4':'webm';
    const blob=new Blob(recordedChunks,{type});downloadBlob(blob,`pose_${stamp()}.${ext}`);
    showToast(recordingUsesComposite?'解析付き動画を保存しました':'動画を保存しました（このブラウザでは合成録画非対応）',3200);
    mediaRecorder=null;
  };
  mediaRecorder.start(1000);
  if(recordingUsesComposite)beginCaptureLoop();
  recordingStartedAt=performance.now();recordBtn.classList.add('recording');recordLabel.textContent='停止';recordTimer.classList.add('visible');updateTimer();recordingTimerHandle=setInterval(updateTimer,250);
}

function stopRecording(){
  if(!mediaRecorder||mediaRecorder.state==='inactive')return;
  mediaRecorder.stop();clearInterval(recordingTimerHandle);recordingTimerHandle=null;recordBtn.classList.remove('recording');recordLabel.textContent='録画';recordTimer.classList.remove('visible');
}
function updateTimer(){const sec=Math.max(0,Math.floor((performance.now()-recordingStartedAt)/1000));timerText.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;}

function exportCsv(){
  if(!csvRows.length){showToast('まだ計測データがありません');return;}
  const headers=['iso_time','elapsed_ms','left_elbow_deg','right_elbow_deg','left_knee_deg','right_knee_deg','left_hip_deg','right_hip_deg','left_ankle_deg','right_ankle_deg'];
  const f=v=>v==null?'':Number(v).toFixed(2);
  const lines=[headers.join(','),...csvRows.map(r=>[
    r.iso_time,r.elapsed_ms,f(r.left_elbow),f(r.right_elbow),f(r.left_knee),f(r.right_knee),f(r.left_hip),f(r.right_hip),f(r.left_ankle),f(r.right_ankle)
  ].join(','))];
  const bom='\uFEFF';downloadBlob(new Blob([bom+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),`pose_angles_${stamp()}.csv`);showToast(`${csvRows.length}件のCSVを保存しました`);
}

startBtn.addEventListener('click',startApp);
photoBtn.addEventListener('click',takePhoto);
recordBtn.addEventListener('click',()=>mediaRecorder&&mediaRecorder.state==='recording'?stopRecording():startRecording());
csvBtn.addEventListener('click',exportCsv);

skeletonToggle.addEventListener('click',()=>{showSkeleton=!showSkeleton;skeletonToggle.classList.toggle('on',showSkeleton);drawOverlay()});
labelsToggle.addEventListener('click',()=>{showLabels=!showLabels;labelsToggle.classList.toggle('on',showLabels);statsPanel.classList.toggle('hidden',!showLabels);drawOverlay()});

settingsBtn.addEventListener('click',()=>settingsSheet.classList.add('show'));
closeSettings.addEventListener('click',()=>settingsSheet.classList.remove('show'));
settingsSheet.addEventListener('click',e=>{if(e.target===settingsSheet)settingsSheet.classList.remove('show')});

document.getElementById('smoothSeg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return; smoothAlpha=Number(b.dataset.v); [...b.parentElement.children].forEach(x=>x.classList.toggle('active',x===b));
});
document.getElementById('csvSeg').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return; csvInterval=Number(b.dataset.v); [...b.parentElement.children].forEach(x=>x.classList.toggle('active',x===b));
});

addEventListener('resize',()=>{resizeOverlay();configureCaptureCanvas();drawOverlay()});
addEventListener('orientationchange',()=>setTimeout(()=>{resizeOverlay();configureCaptureCanvas();drawOverlay()},250));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mediaRecorder?.state==='recording')stopRecording()});

// UIだけ先に表示し、モデルロードはユーザー操作後に開始してiOSのカメラ権限フローを安定させる。
resizeOverlay();
</script>
</body>
